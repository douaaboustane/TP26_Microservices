version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookdb
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-network

  pricing-service:
    build:
      context: ./pricing-service
      dockerfile: Dockerfile
    container_name: pricing-service
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network

  book-service-1:
    build:
      context: ./book-service
      dockerfile: Dockerfile
    container_name: book-service-1
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
    depends_on:
      mysql:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    networks:
      - microservices-network

  book-service-2:
    build:
      context: ./book-service
      dockerfile: Dockerfile
    container_name: book-service-2
    ports:
      - "8083:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
    depends_on:
      mysql:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    networks:
      - microservices-network

  book-service-3:
    build:
      context: ./book-service
      dockerfile: Dockerfile
    container_name: book-service-3
    ports:
      - "8084:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
    depends_on:
      mysql:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    networks:
      - microservices-network

volumes:
  mysql_data:

networks:
  microservices-network:
    driver: bridge

